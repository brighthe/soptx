# -*- coding: utf-8 -*-
# Hu--Zhang 拓扑优化投稿论文算例注册表
#
# 一条 [[cases]] = 一次实验的完整定义, 全参数显式写全, 无继承层;
# 修改任何参数只改这里。物理模型位于 src/soptx/problems/elasticity/,
# 本文件只选择模型并给出离散与优化参数; 「数值 -> soptx 对象」的构造在
# pipeline.py, TOML 不承担构造逻辑。
#
# 注册表分两段: 前 4 条 case (共 3 个工况) 是真实载荷工况 (有边界条件与载荷,
# 走 driver.py 的优化/状态对比链路), 后 2 条是前向制造解验证算例 (无载荷、无优化, 走
# convergence.py)。后者不是工况, 故不参与工况编号, 单列一段。
#
# 命名口径: case id 只标研究对象, 不标参数取值。凡是纯离散层的扫描 (网格加密、
# 阶次) 一律用命令行覆盖跑, 不另立 id; 只有换模型类或换连续问题 (A 问题层, 如
# 泊松比从可压缩推到近不可压) 才另立一条 case。
# 产物目录第二层是参数标签 analyzer-<链>__order-<k>, 覆盖了注册值的字段 (含 nx/ny)
# 再按字段名追加 __<字段>-<取值>, 因此同一 case 在不同网格下的产物不会互相覆盖。
#
# 工况一览 (3 个工况, 4 条 case):
#
#   1.  compliance-fixed-fixed-half   两端固支梁       80x20  k=2,3,4    左半域对称降维
#       论文 5.2.1 节即在左半计算域上求解, 图 5.2 按对称镜像呈现全域构型;
#       全域 160x20 版本只作对称降维核对的参照, 不再注册
#
#   2A. bearing-compressible          轴承装置        120x40  k=2        nu=0.3
#   2B. bearing-incompressible        轴承装置        120x40  k=2,3,4    nu=0.4999
#       另立 id 的理由 = nu 属 A 问题层, 改它等于换题目 (可压缩基准组 vs
#       近不可压实验组, 用于查 LFEM 体积锁定)
#       两条 case 注册网格均为 triangle-single-diagonal-symmetric (对称单向对角,
#       P1 位移元的经典闭锁构型), 优化器均为 OC (工况 1 为 MMA);
#       supplementary_orders = [1] 放开 lfem p=1 作同位移阶次的闭锁对照。
#
#   3.  cantilever-middle-2d-stress   悬臂梁应力约束   80x40  k=2,3,4    (注册默认网格)
#       网格加密不另立 id, 用覆盖参数跑:
#         run.py --case cantilever-middle-2d-stress --nx 160 --ny 80 --order 2 3
#       注意 run.py --all 只按注册默认网格 80x40 跑, 细网格需单独执行上面这条。
#
# 验证算例一览 (2 个, role = convergence-verification):
#
#   V1. manufactured-native           论文 5.1.1 节 / 表 5.1  k=3,4  原生鞍点格式
#   V2. manufactured-stabilized       论文 5.1.2 节 / 表 5.2  k=1,2  矩阵跳量稳定化
#       变体轴 = 空间次数与稳定化 (k>=GD+1 原生稳定 vs k<=GD 必须加跳量项)
#
# 参数分类轴 = "改了它, 变的是题目还是解题路径":
#   台账         id/title/role/status/methods/metrics/paper_table, 不进求解;
#   A 问题       [cases.model], 连续问题本身 (模型/载荷/材料/平面假设), 与离散无关;
#   B 离散       [cases.discretization], 有限维近似 (网格/比较阶次/松弛/稳定化/解法器);
#   C 拓扑建模   [cases.optimization] 中的插值/void/过滤/体积上限, 必然改变最优解;
#   D 算法       [cases.optimization] 中的优化器/终止准则/罚参数更新, 求同一问题的不同路径,
#                收敛意义下应给出同一个解。
# C 与 D 共用 [cases.optimization] 一张表 (config.flatten_parameters 会把三张表拍平),
# 故在表内用行内分隔注释区分, 不再拆表。
#
# 同一工况内两个变体只允许沿该工况的变体轴取值不同, 其余参数逐项字面一致;
# 否则观察到的差异归因不到变体轴上。

schema_version = 1
stage = "soptx/huzhang-topopt-paper/v1"

[meta]
title = "Hu--Zhang 混合有限元拓扑优化投稿论文复现实验"
topic = "Hu--Zhang 应力混合元与 LFEM 位移元在柔顺度/近不可压/应力约束拓扑优化下的对照, 及混合元收敛阶验证"
date_created = "2026-08-01"
date_updated = "2026-09-01"

# =====================================================================
# 第一段: 真实载荷工况 (role != convergence-verification, 由 driver.py 驱动)
# =====================================================================

# ---------------------------------------------------------------------
# 工况 1/3: 中点受载两端固支梁, 取左半计算域并施加对称边界 (80x20)。
# 论文 5.2.1 节即在此半域上求解; 全域 160x20 版本只作对称降维核对的参照,
# 不再注册 (参数见 README「全域固定梁模型」一节)。
# k=1 单列在 supplementary_orders 里 (供补充失效专题 supp-k1), 不进缺省也不进 --full。
# ---------------------------------------------------------------------
[[cases]]
# -- 台账 (不进求解) --
id = "compliance-fixed-fixed-half"
title = "中点受载两端固支梁（左半域对称降维）"
role = "optimization-baseline"
status = "ready"
methods = ["lfem", "huzhang"]
metrics = [
  "compliance",
  "volume_fraction",
  "relative_equilibrium_residual",
  "optimization_iterations",
]

# -- A 问题 (连续问题本身; 与工况 1A 仅差计算域与对称边界, 由模型类给出) --
[cases.model]
name = "FixedFixedBeamHalfDomain2d"

[cases.model.parameters]
load = -3.0
load_width = 1.0
load_discretization = "p1_trace_l2_projection"
youngs_modulus = 30.0
poisson_ratio = 0.4
plane_type = "plane_stress"

# -- B 离散 (有限维近似; nx/ny 同时决定设计空间分辨率) --
[cases.discretization]
# 网格类型 (进 config, 具名开关 --mesh-type): triangle-checkerboard = 棋盘格交替对角
# (nx, ny 须为偶数; 本文算例默认); triangle-single-diagonal-symmetric = 左半 / 右半 \
# 镜像对称单向对角 + 两个顶角落翻转 (nx 须为偶数), 低阶位移元体积闭锁对照用它.
mesh_type = "triangle-checkerboard"
nx = 80
ny = 20
# 正文对比组 (--full 展开的就是它); 论文 5.2.1 节排除 k=1: P_0 位移丧失刚体转动 RM 完备性.
comparison_orders = [2, 3, 4]
# 补充专题阶次: 只进 --order 白名单, 不进缺省也不进 --full, 供 supp-k1 失效专题取数.
supplementary_orders = [1]
use_relaxation = true
solve_method = "mumps"

# -- C 拓扑建模 + D 算法 (optimizer 起) --
[cases.optimization]
volume_fraction = 0.4
filter_type = "density"
filter_radius = 2.4
interpolation_method = "msimp"
penalty_factor = 3.0
void_youngs_modulus = 1.0e-9
# nu_0 = 0.4 为可压缩材料, 只插值 Young 模量。显式登记而不留给 auto: auto 按材料
# 自动决定, 若日后把 poisson_ratio 调到 0.4999 做变体, 会静默切成 E+nu, 而本条是
# 柔顺度基准, 插值对象不应随材料变。
interpolation_variables = "E"
optimizer = "mma"   # 论文 5.2.1 节正文用 MMA; OC 对照用 --optimizer oc, 取值进目录名
# 与 MMAOptions 现行缺省同值, 显式登记是为了钉住: 上游改缺省时本条运行语义不变,
# 且 results_analysis.md 5.2.1 节所记取值有注册表兜底。扫描仍走 --override。
move_limit = 0.2
asymp_init = 0.5
max_iterations = 500
change_tolerance = 1.0e-2

# ---------------------------------------------------------------------
# 工况 2/3 变体 A: 二维轴承装置, 顶边均布 traction, 平面应变。
# nu = 0.3 可压缩基准组, 作为近不可压实验组的对照底。
# ---------------------------------------------------------------------
[[cases]]
# -- 台账 (不进求解) --
id = "bearing-compressible"
title = "二维轴承装置（可压缩基准组 nu=0.3）"
role = "incompressible-baseline"
status = "ready"
methods = ["lfem", "huzhang"]
metrics = [
  "compliance",
  "volume_fraction",
  "relative_equilibrium_residual",
  "optimization_iterations",
]

# -- A 问题 (连续问题本身; poisson_ratio 即本工况的变体轴) --
[cases.model]
name = "BearingDevice2d"

[cases.model.parameters]
traction = -0.08
youngs_modulus = 1.0
poisson_ratio = 0.3
plane_type = "plane_strain"

# -- B 离散 (有限维近似; nx/ny 同时决定设计空间分辨率) --
[cases.discretization]
# 对称单向对角网格: 左半 /, 右半 \, 与左右对称的轴承问题同对称性;
# lfem p=1 在该剖分上出现经典体积闭锁, 棋盘格剖分 (triangle-checkerboard) 则基本不闭锁,
# 棋盘格对照用 --mesh-type triangle-checkerboard 覆盖, 取值进产物目录名。
mesh_type = "triangle-single-diagonal-symmetric"
nx = 120
ny = 40
comparison_orders = [2]
# lfem p=1 只作闭锁对照, 不进缺省也不进 --full; huzhang k=1 拓扑优化不可用 (P0 位移无刚体转动)。
supplementary_orders = [1]
use_relaxation = true
solve_method = "mumps"

# -- C 拓扑建模 + D 算法 (optimizer 起) --
[cases.optimization]
volume_fraction = 0.35
filter_type = "density"
filter_radius = 2.0
interpolation_method = "msimp"
penalty_factor = 3.0
void_youngs_modulus = 1.0e-9
# 插值对象只有 Young 模量, Poisson 比固定为 0.3 (论文 5.2.2 节: 可压缩基准组不插值 nu)
interpolation_variables = "E"
# 两条轴承 case 用 OC (MMA 及其渐近线扫描不能复现三拱构型, 产物见
# outputs/archive/bearing-incompressible-20260914-mma/); MMA 对照用 --optimizer mma, 取值进目录名。
optimizer = "oc"
# 与 OCOptions 现行缺省同值, 显式登记是为了钉住上游缺省变动 (论文 5.2.2 节: m = 0.2)。
# 阻尼指数 eta_OC = 0.5 不经注册表, 硬编码于 pipeline.py; asymp_init 仅 MMA 读取, 不登记。
move_limit = 0.2
max_iterations = 1000
change_tolerance = 1.0e-2

# ---------------------------------------------------------------------
# 工况 2/3 变体 B: 同工况 2A, 仅把 nu 提到 0.4999 逼近不可压极限。
# 变体轴 = 泊松比; 另外把比较阶次铺到 k=2,3,4, 用于查 LFEM 体积锁定。
# ---------------------------------------------------------------------
[[cases]]
# -- 台账 (不进求解) --
id = "bearing-incompressible"
title = "二维轴承装置（近不可压缩实验组 nu=0.4999）"
role = "incompressible-study"
status = "ready"
methods = ["lfem", "huzhang"]
metrics = [
  "compliance",
  "volume_fraction",
  "relative_equilibrium_residual",
  "optimization_iterations",
]

# -- A 问题 (连续问题本身; poisson_ratio 即本工况的变体轴) --
[cases.model]
name = "BearingDevice2d"

[cases.model.parameters]
traction = -0.08
youngs_modulus = 1.0
poisson_ratio = 0.4999
plane_type = "plane_strain"

# -- B 离散 (有限维近似; nx/ny 同时决定设计空间分辨率) --
[cases.discretization]
# 注册网格为对称单向对角 (同 2A): lfem p=1 / lfem p=2 / huzhang k=2,3 在同一网格上并排跑。
# 棋盘格对照用 --mesh-type triangle-checkerboard 覆盖, 取值进产物目录名。
# 注册值切换前 (棋盘格 + OC) 的全部产物已移至 outputs/archive/bearing-*-20260914-legacy/,
# 两条 case 的 outputs/ 目录自 2026-09-14 起只含新注册值下的结果。
mesh_type = "triangle-single-diagonal-symmetric"
nx = 120
ny = 40
comparison_orders = [2, 3, 4]
supplementary_orders = [1]
use_relaxation = true
solve_method = "mumps"

# -- C 拓扑建模 + D 算法 (optimizer 起) --
[cases.optimization]
volume_fraction = 0.35
filter_type = "density"
filter_radius = 2.0
interpolation_method = "msimp"
penalty_factor = 3.0
void_youngs_modulus = 1.0e-9
# 论文 5.2.2 节: 近不可压缩组 E 与 nu 双参数插值, 式 (4.3) 取 nu_void=0.3, p_nu=1;
# LFEM 与 Hu--Zhang 同一材料模型. 想对照 "只插值 E" 的旧做法用 --interpolation E.
interpolation_variables = "E+nu"
nu_penalty_factor = 1.0
void_poisson_ratio = 0.3
# 两条轴承 case 用 OC (MMA 及其渐近线扫描不能复现三拱构型, 产物见
# outputs/archive/bearing-incompressible-20260914-mma/); MMA 对照用 --optimizer mma, 取值进目录名。
optimizer = "oc"
# 与 OCOptions 现行缺省同值, 显式登记是为了钉住上游缺省变动 (论文 5.2.2 节: m = 0.2)。
# 阻尼指数 eta_OC = 0.5 不经注册表, 硬编码于 pipeline.py; asymp_init 仅 MMA 读取, 不登记。
move_limit = 0.2
max_iterations = 1000
change_tolerance = 1.0e-2

# ---------------------------------------------------------------------
# 工况 3/3: 二维悬臂梁局部应力约束拓扑优化。
# 优化器换 AL-MMA (增广拉格朗日 + MMA), 无体积上限, 求的是应力约束下的
# 体积最小化, 故 metrics 不含 compliance。
#
# 本工况只有一条 case: 网格是纯离散参数, 加密不另立 id。注册值是粗网格
# 80x40 (论文 5.2.3 节插图与 metrics 的默认口径); 论文用到的细网格结果由
#   run.py --case cantilever-middle-2d-stress --nx 160 --ny 80 --order 2 3
# 产生, 写入 outputs/cantilever-middle-2d-stress/<method>-k<order>-al_mma-160x80/,
# 与粗网格产物并存互不覆盖。细网格只跑 k=2,3 (k=4 在该规模下代价过高)。
# ---------------------------------------------------------------------
[[cases]]
# -- 台账 (不进求解) --
id = "cantilever-middle-2d-stress"
title = "二维悬臂梁应力约束体积最小化"
role = "stress-constrained"
status = "ready"
methods = ["lfem", "huzhang"]
metrics = [
  "volume_fraction",
  "relative_equilibrium_residual",
  "optimization_iterations",
]

# -- A 问题 (连续问题本身; stress_limit/epsilon 属应力约束的问题定义) --
[cases.model]
name = "CantileverMiddle2d"

[cases.model.parameters]
load = -400.0
load_width = 6.0
load_discretization = "patch"
# 论文算例 5.4 正文 (chapter05.tex:1040) 的物理值是 E=70000 MPa, 但此处必须取 1.0,
# 原因是本 case 的 LFEM 与 Hu-Zhang 两个 analyzer 共用这一组模型参数, 而带跳量稳定化
# 的胡张混合元不允许代入真实高模量: 柔度块 O(1/E) 与稳定化惩罚块 O(E) 使鞍点系统
# 条件数达 O(E^2), E=70000 时 MUMPS 直接报 error -9 (见 jump_penalty_integrator.py:225
# 的运行时警告, 已实测复现)。第五章统一框架 chapter05.tex:807 写的 E_0=1 MPa 正是
# 这条数值约束的记录。
# 出图用的旧程序对两种方法分别取值, 未共用:
#   soptx-thesis/.../test_phd_section5_stress_constraint.py:234 LFEM  -> E = 7e4
#   同文件 :37                                                  HZ    -> E = 1.0 (7e4 已注释)
# 归一化不影响应力约束评估: 纯 traction + 齐次 Dirichlet 下 Sigma 与 E 无关,
# 仅位移/柔顺度需按 U_real = U_calc / E_real 还原。
# 遗留差异: void_youngs_modulus 是绝对值, 旧程序 LFEM 的 (7e4, 1e-9) 刚度比为 1.4e-14,
# 此处 (1.0, 1e-9) 为 1e-9, 两者并非严格等价, 属已知偏差。
youngs_modulus = 1.0
poisson_ratio = 0.25
plane_type = "plane_stress"
stress_limit = 180.0
# 2026-09-15: 1e-4 -> 1e-3。epsilon 要与过渡区单元的 m_E (rho 0.2-0.3 时约 0.002-0.03) 同量级
# 才起松弛作用: 取 1e-4 时滤波尾部单元 (design 已到下界 0, rho_phys 由邻域决定, 实体应力比
# 1.3-2.7) 的 g 钉在 0.003 附近, mu 饱和后 AL 只能靠往其邻域加材料慢慢压 (LFEM k=3 为此多花
# 434 步, 体积反涨 0.003), 且阶次越高越重。1e-3 使这些单元直接满足约束 (k=3: 423 步, 拓扑不变,
# 实体区 rho>0.7 应力比上限 1.004 不变, 仅 rho 0.5-0.7 灰度带放宽到 1.011)。
# 论文 (4.7) 与 §5 参数段须同步改为 1e-3; 旧值对照走 --override epsilon=1e-4。
epsilon = 1.0e-3
# 2026-09-16: 载荷引入垫片半径 (mm)。右端牵引在贴片端点 (80, 17) 与 (80, 23) 处
# 跳变 P/l, 该间断点的应力奇异性是载荷模型自带的, 载荷分布化只消除点载荷的 r^-1
# 奇异, 消不掉端点奇异 (实测实体应力比随阶次单调升: LFEM k=1..4 为 2.77/3.94/4.19/4.50,
# HZ k=2 为 4.31, 无收敛迹象), 设计也消不掉。不处理时 HZ k=2 的端点外侧单元
# (79.33, 16.33) 在第 200-250 步成形后 750 步不动, 第 400 步后是全域唯一违反约束的
# 单元, 迫使 1000 步撞上限。
#
# 该半径同时定义两件事, 必须成对施加, 只做其一会出错:
#   1) 应力豁免 —— 邻域内不施加局部应力约束;
#   2) 实体保留 (passive solid) —— 邻域内物理密度钉为 1, 密度灵敏度置零。
# 只豁免不保留的对照 (2026-09-16, HZ k=2): 确实从 1000 步不收敛变为 536 步收敛,
# 但优化器发现该邻域不再受约束, 把原本被应力约束逼着保持 rho~0.98 的单元减到
# 0.67 换体积, 实体应力比从 0.68 涨到 1.45, max_solid_stress_ratio_solid_region
# 由历年稳定的 1.01-1.03 跳到 1.452。豁免只要留下设计自由度就会被利用。
#
# 取 1.5 = l/4, 按固定物理尺寸定义, 不随网格加密缩小; 80x40 网格下两端各 8 个
# 单元, 共 16/6400 = 0.25%, 贴片内部 y in (18.5, 21.5) 仍受约束且仍是设计域。
# 四个 LFEM 阶次在 R<=4.0 时结果不受影响 (其起作用单元在固支端 x~8), 但两条路径
# 必须在同一验收区域上比较, 故统一施加。0 表示关闭 (历史行为)。
# 依据: 博士论文 2.3.3 节; dut-postdoc concepts/density-topopt/stress-constrained-topopt.md 5.2 节。
load_pad_radius = 1.5

# 固支角点垫片半径 (mm). 左端固支边的两个端点 (0, 0) 与 (0, 40) 是
# Dirichlet--Neumann 混合边界角点: 位移边界与自由边在此相接, 应力按 r^(lambda-1)
# 奇异, lambda 为 Williams 特征值, 只依赖楔角与泊松比. 直角楔平面应力 nu=0.25 时
# lambda = 0.78107, 即 sigma ~ r^(-0.2189): 幂律发散, 网格每加密一倍读数放大
# 2^0.219 ~ 1.16 倍, 不收敛到有限值, 符合 exemption 模块的豁免判据.
#
# 与载荷侧的关键区别: 载荷侧先做了"载荷分布化"(集中力改为宽度 l 的分布牵引),
# 把奇点削弱到对数型, 豁免只需收拾残留; 固支角点的奇异性由边界条件类型的改变
# 产生, 数据再光滑也不消失, 没有分布化这一步可做, 豁免 + 实体保留是仅有的两步.
# 因此支撑侧的残留奇点比载荷侧强, 半径不能沿用 load_pad_radius = 1.5.
#
# 取 0 表示不处置 (2026-09-16 之前的历史行为, 亦即 §5.2.3 旧结果的口径)。
# 非零取值必须由 h-加密探针标定: 在冻结构型上按到角点的距离分环做 h 细化, 取
# 第一个读数随 h 收敛的环的内径. 拍脑袋取小值只会把热点搬到掩码边界, 机理同
# 2026-09-16 那次只豁免不保留的事故。
support_pad_radius = 0.0

# -- B 离散 (有限维近似; nx/ny 是注册默认网格, 细网格用 --nx/--ny 覆盖) --
[cases.discretization]
mesh_type = "triangle-checkerboard"
nx = 80
ny = 40
comparison_orders = [1, 2, 3, 4]
use_relaxation = true
solve_method = "mumps"

# -- C 拓扑建模 (前六项) + D 算法 (其余) --
[cases.optimization]
# "projection" = 密度过滤 + tanh 投影 (ProjectionStrategy 继承 DensityStrategy),
# 投影参数 beta 1.0 -> 10.0 每 5 个外层 +1, 由 pipeline.build_stress_pipeline 写死.
# 出处: 论文 chapter04.tex:955, 第 4.6 节 (subsec:lfem_stress_constraint) 的节级
# 统一配置 —— "投影策略采用连续延续策略, 初始投影参数取 beta=1.0, 每 5 个迭代步
# 递增 1.0, 上限取 beta_max=10.0", 与此处取值逐项一致, 论文并未漏记。
# 第五章算例 5.4 只重复了密度过滤半径, 其 ALM/投影/收敛判据实际继承第 4.6 节。
# 佐证: 只留密度过滤会停在灰度局部解 (V=0.58, max_vm=0.92, 应力约束不激活)。
filter_type = "projection"
filter_radius = 6.0
interpolation_method = "msimp"
penalty_factor = 3.5
void_youngs_modulus = 1.0e-9
# 两条分析链统一采用 g=sigma_app/stress_limit-[m_E+epsilon(1-m_E)].
# LFEM 原多项式消失约束保留为 --override stress_constraint_formulation=vanishing;
# 该字段恒进应力算例的产物目录名, 因而不会覆盖旧的无标签结果.
stress_constraint_formulation = "apparent"
initial_density = 0.5
optimizer = "al_mma"
# 2026-09-11: 150 -> 200。09-09/09-10 四次 k=2 运行均在 150 步达上限未收敛。
max_al_iterations = 200
mma_iters_per_al = 5
change_tolerance = 2.0e-3
# 2026-09-17: 3.0e-3 -> 5.0e-3。3.0e-3 下 LFEM p=2 与 HuZhang k=2 的内层提前
# 退出过于频繁, delta_g 经 al_mma.py:585 反馈进轨迹, 使两条链在 mu_max 触顶后
# 仍无法满足 C2。5.0e-3 下 LFEM p=1/2/3 与 HuZhang k=2/3 五条臂均以
# criterion-met 收敛 (外层 53/59/57/66/54), 故按本文件协议提升为默认值。
# HuZhang k=4 尚未确认, 该臂仍需单独诊断。
stress_tolerance = 5.0e-3
# 停止准则 C3: 需连续 hold_steps 个 ALM 外层步同时满足 C0-C2 才判收敛,
# 用于排除乘子更新与 MMA 渐近线调整造成的振幅穿越阈值的偶然命中。
hold_steps = 3
# alpha=1.1, 内层 5 步 MMA, 移动限制 0.15 (mu_max 与最大外层步数见下方各注)
# 均与论文 chapter04.tex:941-951 第 4.6 节节级统一配置逐项一致。
# 唯一偏离论文正文的是 mu_0: 论文 §4.6 统一写 mu_0=10.0, 但出图用的旧程序
# soptx-thesis/soptx/optimization/test_phd_section5_stress_constraint.py 中
# test_subsec5_6_4_canti2d_lfem / _hzmfem 两条悬臂梁实取 mu_0 = 50.0。
# 即论文正文的 10.0 与实际产出图 5.4 的运行配置不符, 应以 50.0 为准并修订论文。
mu_0 = 50.0
# 2026-09-11 曾 1e4 -> 1e5: Hu-Zhang k=2 在 mu 饱和 1e4 后 g_max 以每外层步约 1e-4
# 缓慢下降 (0.007 -> 0.0033, 外层步 109-151), 当时把饱和当成 C2 的瓶颈。2026-09-15 查明
# 该慢尾来自滤波尾部单元 (见 epsilon 注), 根因是 epsilon 过小与渐近线下限过高, 与 mu 上限无关,
# 故退回论文 §4.6 / PolyStress 的 1e4; 若某阶次在 1e4 下拖尾, 对照走 --override mu_max=1e5。
mu_max = 10000.0
alpha = 1.1
lambda_0_init_val = 0.0
move_limit = 0.15
# MMA 渐近线距当前点的下限 (相对设计区间)。PolyStress 无此下限: 两值振荡的变量
# 按 AsymDecr=0.7 逐步收缩渐近线, 步幅几何衰减后停在约束折点上。2026-09-11 因
# Hu-Zhang k=2 渐近线塌缩触发候选点公式相消崩溃而设 0.01, 但它高于末期移动限
# 0.005, 等于关掉了这一逐变量阻尼, 灰度带单元被钉在 0.005 幅度上翻转 (2026-09-15
# LFEM k=1 1000 步不收敛)。相消已由稳定候选点公式解决, 2026-09-15 起退回 1e-4
# 只防下溢; 旧值对照用 --override asymptote_min_distance=0.01。
asymptote_min_distance = 1.0e-4
# 以下三组开关的消融与修复验证一律走 --override, 使输出目录被 _run_label 分开
# 而不覆盖基线; 确证有效后再提升为此处的默认值。
# 1) 末期移动限制衰减: decay = 1.0 关闭。启用时仅在连续化终止 (C0) 之后,
#    且窗口 W 内的运动被判为非相干 (相干行程份额 < ratio) 才收缩移动限制,
#    仍在单调重组的轨迹不收缩, 以免冻在非驻点上误报收敛。
# 2026-09-11 曾默认启用 (0.8) 以压住灰度带单元的两值翻转; 2026-09-15 查明该翻转
# 源于渐近线下限 0.01 关掉了 MMA 自带的振荡收缩, 下限退回 1e-4 后 LFEM k=1 有无
# 衰减都收敛 (437 步 V=0.3637 / 416 步 V=0.3626, 拓扑只差 15 个单元), 衰减既不改
# 结果也不加速, 故关闭, 与 PolyStress (无衰减) 及论文 Algorithm 2 对齐。
# 后四项仅在 decay < 1.0 时生效; 对照用 --override move_limit_decay=0.8。
move_limit_decay = 1.0
move_limit_min = 5.0e-3
move_limit_progress_window = 10
move_limit_progress_ratio = 0.3
move_limit_progress_cell = 0.7
# 2) 停止准则 C1 的度量对象: "mean" 为外层步首末设计变量的平均绝对变化
#    (PolyStress 口径, 2026-09-11 起默认); "design" / "physical" 为逐 MMA 步的
#    设计变量 / 物理密度最大绝对变化 (09-09 至 09-10 用 "design", 被移动限制钉死)。
change_measure = "mean"
# 3) 罚因子放大规则: "unconditional" 为每外层步无条件放大;
#    "conditional" 时仅当 max_e r_e > tau * 上一步值 (不可行度下降不足) 才放大。
mu_update_rule = "unconditional"
mu_violation_ratio = 0.5
# 4) 乘子安全阈 (safeguarded AL, Andreani-Birgin-Martinez 2007): 外层更新改为
#    lambda <- P_[0, lambda_max](lambda + mu h)。2026-09-18 依据: 统一协议下带垫片的
#    五个已收敛臂 (LFEM k=1/2/3, HZ k=2/3) 终止 max lambda 为 372-1344, 无垫片六臂为
#    828-4119 (HZ k=4 为 4119, 只落在 2 个 rho~0.21 的滤波尾部单元上); 带垫片 HZ k=4
#    在 mu 触顶 1e4 后 lambda 无界爬升到 10082, AL 项压过体积目标, 850 步后进入极限环
#    (1000 步不收敛)。3000 高于带垫片已收敛臂终值一倍以上, 不改变它们的极限点; 被它
#    截断的只有无垫片 k=4 那两个灰度单元, 它们在 C2 实体子集之外 (见下一项)。
#    对照 (无阈, 复现 09-17 之前行为): --override lambda_max=1e20。
lambda_max = 3000.0
# 5) 停止准则 C2 的验收子集: 只在 rho_phys >= 阈值的 (未豁免) 单元上取最大相对
#    违反度; 全域值仍作诊断记录 (history 的 max_relative_violation、summary 的
#    max_relative_violation)。2026-09-18 依据: k4 被钉住的是滤波尾部 rho 0.13-0.30
#    的不承载灰度单元 (g 停在 0.005 附近略偏正, 设计无法改动); 老程序 (soptx-thesis)
#    k4 复跑 182 步"收敛"也只因其判据不看中间密度单元, 但复评后实体单元上
#    g_max=0.048 并不可用, 故实体子集验收与乘子安全阈须同时启用。取值与 driver 报告
#    未加权实体应力比的 solid_region_threshold 同为 0.5。该字段恒进目录名
#    (acceptance_solid_threshold-0.5), 09-17 之前的全域口径产物保留在旧目录作对照;
#    命令行给 none 可复原全域口径 (--override acceptance_solid_threshold=none)。
acceptance_solid_threshold = 0.5
# 原问题 KKT 默认仅作终态诊断: 终态增加一次伴随求解, 不改变停止准则.
# 可显式关闭: --override kkt_diagnostics_enabled=false
# 参与 C4 验收还须同时开启 kkt_acceptance_enabled 并显式给出三个正容差;
# 容差没有预设论文值, 不按现有结果反向调节.
kkt_diagnostics_enabled = true
kkt_acceptance_enabled = false
kkt_stationarity_tolerance = 0.0
kkt_complementarity_tolerance = 0.0
kkt_dual_tolerance = 0.0

# =====================================================================
# 第二段: 前向制造解验证算例 (role = convergence-verification, 由
# convergence.py 驱动)。无载荷、无优化, 不是工况, 故不占工况编号;
# [cases.optimization] 只写 optimizer = "none", 以满足 config.load_cases
# 对三张表齐全的校验。
# =====================================================================

# ---------------------------------------------------------------------
# 验证算例 V1/2: 正弦位移制造解, k=3,4 原生鞍点格式 (论文表 5.1)。
# ---------------------------------------------------------------------
[[cases]]
# -- 台账 (不进求解) --
id = "manufactured-native"
title = "正弦位移制造解收敛阶验证 · 原生高阶格式（论文 5.1.1 节 / 表 5.1）"
role = "convergence-verification"
status = "ready"
methods = ["huzhang"]
paper_table = "5.1"
metrics = [
  "u_l2_error",
  "u_l2_order",
  "sigma_l2_error",
  "sigma_l2_order",
  "sigma_hdiv_error",
  "sigma_hdiv_order",
  "relative_equilibrium_residual",
]

# -- A 问题 (连续问题本身; 制造解由模型类给出, 无载荷参数) --
[cases.model]
name = "MixedBoundarySinusoidalElasticity2D"

[cases.model.parameters]
youngs_modulus = 1.0
poisson_ratio = 0.3333333333333333
lame_lambda = 1.0
lame_mu = 0.5
plane_type = "plane_strain"

# -- B 离散 (收敛阶靠 base_nx/base_ny + levels 逐级加密; nx/ny 仅为兼容字段) --
[cases.discretization]
mesh_type = "triangle-checkerboard"
nx = 64
ny = 64
base_nx = 4
base_ny = 4
levels = 5
comparison_orders = [3, 4]
use_relaxation = true
solve_method = "mumps"
# k >= GD+1 (二维即 k >= 3) 时原生鞍点格式本身稳定, HuZhangMFEMAnalyzer 忽略本字段.
# 因此这里只能写 none; 写成 matrix_jump/vector_jump 会被 tools/convergence.py 拒绝,
# 免得跑出一组名义上加了稳定化、实际没加的数.
stabilization = "none"

# -- C 拓扑建模 + D 算法 (本算例不做优化, 仅占位以通过配置校验) --
[cases.optimization]
optimizer = "none"

# ---------------------------------------------------------------------
# 验证算例 V2/2: 同 V1 的制造解与网格协议, k=1,2 加矩阵跳量稳定化
# (论文表 5.2)。变体轴 = 空间次数与稳定化。
# ---------------------------------------------------------------------
[[cases]]
# -- 台账 (不进求解) --
id = "manufactured-stabilized"
title = "正弦位移制造解收敛阶验证 · 低阶跳量稳定化格式（论文 5.1.2 节 / 表 5.2）"
role = "convergence-verification"
status = "ready"
methods = ["huzhang"]
paper_table = "5.2"
metrics = [
  "u_l2_error",
  "u_l2_order",
  "sigma_l2_error",
  "sigma_l2_order",
  "sigma_hdiv_error",
  "sigma_hdiv_order",
  "relative_equilibrium_residual",
]

# -- A 问题 (连续问题本身; 与 V1 逐项字面一致) --
[cases.model]
name = "MixedBoundarySinusoidalElasticity2D"

[cases.model.parameters]
youngs_modulus = 1.0
poisson_ratio = 0.3333333333333333
lame_lambda = 1.0
lame_mu = 0.5
plane_type = "plane_strain"

# -- B 离散 (与 V1 仅差 comparison_orders 与 stabilization) --
[cases.discretization]
mesh_type = "triangle-checkerboard"
nx = 64
ny = 64
base_nx = 4
base_ny = 4
levels = 5
comparison_orders = [1, 2]
use_relaxation = true
solve_method = "mumps"
# k <= GD (二维即 k <= 2) 时本字段直接驱动 HuZhangMFEMAnalyzer 的 stabilization 入参,
# 取值 matrix_jump / vector_jump 对应 JumpPenaltyIntegrator 的两种跳量形式 (只作用在
# 内部面与位移边界面上), none 表示不加稳定化项.
# 论文表 5.2 用 matrix_jump; 消融请用 run.py --case manufactured-stabilized --stabilization none, 不要改本字段.
stabilization = "matrix_jump"
# 论文口径 gamma_0 = 1.0. 当前实现为 alpha = mu / L0**2 (jump_penalty_integrator.py),
# 式中并无显式 gamma_0 系数, 等价于恒等于 1.0; 此字段只记录论文取值, 暂不可调.
gamma_0 = 1.0

# -- C 拓扑建模 + D 算法 (本算例不做优化, 仅占位以通过配置校验) --
[cases.optimization]
optimizer = "none"
