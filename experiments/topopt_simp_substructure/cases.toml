# -*- coding: utf-8 -*-
# 子结构缩聚变密度拓扑优化工况注册表
#
# 一条 [[cases]] = 一次实验的完整定义, 全参数显式写全, 无继承层;
# 修改任何参数只改这里。
#
# 本目录只跑精确局部 Schur 缩聚 (reduction = "exact_schur"), 不含任何
# PIML 近似; 唯一的算法轴是接口迹空间 trace:
#
#   full_trace     保留全部接口自由度, 与原离散系统代数等价, 是实现门禁;
#   linear_corner  角点线性迹 (Huang 2023 式 16), 引入迹降阶误差, 是 PIML 的前置基线。
#
# 误差阶梯: FA -> full_trace -> linear_corner -> PIML 局部代理。
#
# 参数分类轴 (与 experiments/topopt_simp_fa 一致):
#   A 问题       domain / p_load / nu / emax / volfrac;
#   B 离散       n_sub / n_fine / integration_order;
#   C 拓扑建模   simp_penalty / emin / filter_type / filter_radius;
#   D 算法       trace / reduction / chunk_size / max_iter / tol_change;
#   台账         id / summary / fa_reference, 不进求解。
#
# 工况一览 (4 个):
#   1. cantilever_2d_ft   2D 悬臂梁  8x5 子结构 x 10x10 细网格 (80x50 全局, 4000 单元)
#   2. cantilever_2d_lc   2D 悬臂梁  8x5 子结构 x 10x10 细网格 (80x50 全局, 4000 单元)
#   3. mbb_3d_ft          3D MBB 梁  12x2x2 子结构 x 4x4x4 细网格 (48x8x8 全局, 3072 单元)
#   4. mbb_3d_lc          3D MBB 梁  12x2x2 子结构 x 4x4x4 细网格 (48x8x8 全局, 3072 单元)
#
# 成对对比协议:
#   cantilever_2d_ft vs cantilever_2d_lc: 仅 trace 改变, 验证 2D 角点迹降阶误差
#   mbb_3d_ft vs mbb_3d_lc: 仅 trace 改变, 验证 3D 六面体角点迹降阶误差
#
# fa_reference 指向 experiments/topopt_simp_fa/cases.toml 中的同工况 FA 参照。

[meta]
schema_version = "substructure-topopt-cases-v1"
experiment = "topopt_simp_substructure"

[[cases]]
id = "cantilever_2d_ft"
problem = "CantileverCorner2d"
trace = "full_trace"
reduction = "exact_schur"
domain = [0.0, 160.0, 0.0, 100.0]
n_sub = [8, 5]
n_fine = [10, 10]
integration_order = 2
chunk_size = 40
volfrac = 0.5
filter_radius = 3.0
filter_type = "sensitivity"
max_iter = 100
tol_change = 0.001
simp_penalty = 3.0
emin = 1e-6
emax = 1.0
nu = 0.3
p_load = -1.0
seed = 2026
fa_reference = "cantilever_2d_fa"
summary = "完整接口 (full_trace) 精确子结构缩聚 2D 悬臂梁变密度拓扑优化"

[[cases]]
id = "cantilever_2d_lc"
problem = "CantileverCorner2d"
trace = "linear_corner"
reduction = "exact_schur"
domain = [0.0, 160.0, 0.0, 100.0]
n_sub = [8, 5]
n_fine = [10, 10]
integration_order = 2
chunk_size = 40
volfrac = 0.5
filter_radius = 3.0
filter_type = "sensitivity"
max_iter = 100
tol_change = 0.001
simp_penalty = 3.0
emin = 1e-6
emax = 1.0
nu = 0.3
p_load = -1.0
seed = 2026
fa_reference = "cantilever_2d_fa"
summary = "角点线性迹 (linear_corner) 精确子结构缩聚 2D 悬臂梁变密度拓扑优化"

[[cases]]
id = "mbb_3d_ft"
problem = "FullMBBBeam3d"
trace = "full_trace"
reduction = "exact_schur"
domain = [0.0, 12.0, 0.0, 2.0, 0.0, 2.0]
n_sub = [12, 2, 2]
n_fine = [4, 4, 4]
integration_order = 2
chunk_size = 48
volfrac = 0.3
filter_radius = 0.4
filter_type = "sensitivity"
max_iter = 50
tol_change = 0.001
simp_penalty = 3.0
emin = 1e-6
emax = 1.0
nu = 0.3
p_load = -1.0
seed = 2026
fa_reference = ""
summary = "完整接口 (full_trace) 精确子结构缩聚 3D MBB 梁变密度拓扑优化"

[[cases]]
id = "mbb_3d_lc"
problem = "FullMBBBeam3d"
trace = "linear_corner"
reduction = "exact_schur"
domain = [0.0, 12.0, 0.0, 2.0, 0.0, 2.0]
n_sub = [12, 2, 2]
n_fine = [4, 4, 4]
integration_order = 2
chunk_size = 48
volfrac = 0.3
filter_radius = 0.4
filter_type = "sensitivity"
max_iter = 50
tol_change = 0.001
simp_penalty = 3.0
emin = 1e-6
emax = 1.0
nu = 0.3
p_load = -1.0
seed = 2026
fa_reference = ""
summary = "角点线性迹 (linear_corner) 精确子结构缩聚 3D MBB 梁变密度拓扑优化"
