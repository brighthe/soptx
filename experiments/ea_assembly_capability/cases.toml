args = ["--worker", "--cache", "--variant", "per_element", "--method", "fast", "--mesh", "hex", "--p", "1", "--n", "32"]
output_mode = "file"
artifact = "cache_per_element_fast_hex_p1_n32.json"
mesh_type = "HexahedronMesh"
mesh = "hex"
p = 1
grid = "32^3"
problem = "DivergenceFreePolynomialElasticity3D"
method = "fast"
variant = "per_element"
n = 32

