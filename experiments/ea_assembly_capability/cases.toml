# ea_assembly_capability 数据点注册表.
#
# 约定 (与 fa_assembly_capability 一致):
#   script       仓库根起算的脚本路径, 三个数据点都由 run.py 的 Worker 模式测量.
#   args         Worker 固定参数; 调度层按 methods / n / repeats / maxiter / tol 展开与覆盖.
#   output_mode  "file": 调度层把 --output <outputs/artifact> 追加到 argv.
#   artifact     代表性产物名; 实际文件名由调度层按 <kind>_<method>_n<N>.json 生成.
#   panel        cache (单刚缓存 K_e) / matvec (核心 EA 刚度算子乘 K x) / solve (核心 Jacobi-PCG 求解, 每步 facade @ x)
#                / baseline (单核硬件基线, 与网格无关, env 限制线程数为 1).
#   method       单刚组装方式, 三个阶段 (panel) 默认只跑 fast; --method standard/voigt/all 可手动复现 fa 阶段 1, 不进正文.
#
# 被测对象是仓库核心代码 soptx.fem.matrix_free.ElasticityEAOperator (LagrangeFEMAnalyzer 'ea' 路径 +
# soptx.fem.BilinearForm 的 @ + DirichletBCOperator) 与 soptx.solvers.cg; run.py 不含自有算子 / 求解器实现.
# 注意: 每个数据点独占一个子进程. Worker 内每阶段重置 VmHWM 取绝对峰值, 全程峰值 = 各阶段峰值最大值.
# 问题、网格、空间与材料的构建和 fa_assembly_capability 完全相同 (experiments/_common/fe_problem.py);
# 阶段 1 (panel cache) 的 K_e 与 fa 阶段 1 是否逐位一致由 `run.py --verify-fa` 核对, 两目录的 K_e 阶段数字可直接对照.

[figure]
id = "ea_assembly_capability"
title = "EA 单元装配无矩阵算子的内存机制与容量能力"
question = "缓存 K_e 的 EA 算子: 常驻多大、算子乘多快、Jacobi-PCG 迭代数如何随 n 增长"
consumer = "dut-postdoc:research/piml-matrix-free-gpu/project-plan.md"

[[cases]]
id = "element-cache"
panel = "cache"
role = "element-stiffness-cache"
summary = "assemble_stiff_matrix('ea') 缓存 K_e (NC, 12, 12) 与 cell2dof 的阶段峰值 / 净增 (fast), 与 fa 阶段 1 同口径"
script = "experiments/ea_assembly_capability/run.py"
args = ["--worker", "--cache", "--method", "fast", "--n", "32"]
output_mode = "file"
artifact = "cache_fast_n32.json"
mesh_type = "TetrahedronMesh"
grid = "32^3"
problem = "DivergenceFreePolynomialElasticity3D"
method = "fast"
n = 32

[[cases]]
id = "ea-matvec"
panel = "matvec"
role = "ea-operator-matvec"
summary = "核心 EA 刚度算子乘 K x (operator.form @ x, soptx.fem.BilinearForm 的 @), 重复计时取中位数与有效带宽下界"
script = "experiments/ea_assembly_capability/run.py"
args = ["--worker", "--matvec", "--method", "fast", "--n", "32", "--repeats", "20"]
output_mode = "file"
artifact = "matvec_fast_n32.json"
mesh_type = "TetrahedronMesh"
grid = "32^3"
problem = "DivergenceFreePolynomialElasticity3D"
method = "fast"
n = 32
repeats = 20

[[cases]]
id = "ea-continuous"
panel = "continuous"
role = "ea-matvec-continuous-study"
summary = "同一进程连续测量: 单刚缓存 -> 输入准备 -> 首次算子乘 (工作区物化) -> 稳态重复算子乘 (零内存增长)"
script = "experiments/ea_assembly_capability/run.py"
args = ["--worker", "--continuous", "--method", "fast", "--n", "32", "--repeats", "20"]
output_mode = "file"
artifact = "cache_matvec_continuous_fast_n32.json"
mesh_type = "TetrahedronMesh"
grid = "32^3"
problem = "DivergenceFreePolynomialElasticity3D"
method = "fast"
n = 32
repeats = 20

[[cases]]
id = "ea-cg-solve"
panel = "solve"
role = "jacobi-pcg-iteration-growth"
summary = "核心 EA 算子 + soptx.solvers.cg (Jacobi) 求解制造解问题: 迭代数、单步耗时与全程峰值"
script = "experiments/ea_assembly_capability/run.py"
args = ["--worker", "--solve", "--method", "fast", "--n", "32", "--maxiter", "5000", "--tol", "1e-6"]
output_mode = "file"
artifact = "solve_fast_n32.json"
mesh_type = "TetrahedronMesh"
grid = "32^3"
problem = "DivergenceFreePolynomialElasticity3D"
method = "fast"
n = 32
preconditioner = "jacobi"
maxiter = 5000
tol = 1e-6

[[cases]]
id = "cpu-baseline"
panel = "baseline"
role = "hardware-baseline"
summary = "单核硬件基线: memcpy 带宽 (2 GiB x2, 读 + 写) 与 dgemm 算力 (n = 4096), 供阶段 2 换算带宽 / 算力占比"
script = "experiments/ea_assembly_capability/run.py"
args = ["--worker", "--baseline"]
output_mode = "file"
artifact = "baseline_cpu.json"
env = { OMP_NUM_THREADS = "1", OPENBLAS_NUM_THREADS = "1", MKL_NUM_THREADS = "1" }
mesh_type = "-"
grid = "-"
problem = "-"
method = "-"
