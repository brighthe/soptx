schema_version = 1
stage = "soptx/huzhang-topopt-paper/common-evidence-v1"
status = "configured"
description = "Route-neutral Hu–Zhang topology-optimization evidence matrix."

[provenance]
required_packages = ["soptx", "fealpy", "numpy", "scipy", "sympy", "matplotlib"]
formal_requires_clean_revision = true
hash_algorithm = "sha256"
random_seed = 0

[acceptance]
high_order_rate_deficit = 0.35
relative_equilibrium_residual_max = 1.0e-8
normalized_normal_trace_jump_max = 1.0e-10
state_matrix_symmetry_error_max = 1.0e-12
finite_difference_relative_error_max = 1.0e-5
volume_fraction_absolute_error_max = 1.0e-3
stress_constraint_violation_max = 3.0e-3
frozen_design_relative_change_max = 1.0e-2

[outputs]
manifest = "manifest.json"
summary = "summary.json"
metrics = "metrics.csv"
history = "history.csv"
figures_directory = "figures"

[[cases]]
id = "forward-manufactured"
role = "analysis-baseline"
problem = "mixed-boundary-sinusoidal-elasticity-2d"
methods = ["huzhang"]
mesh_families = ["uniform-tri", "irregular-star-refined"]
orders = [1, 2, 3, 4]
levels = [1, 2, 3, 4, 5]
metrics = [
  "displacement_l2_error",
  "stress_l2_error",
  "div_stress_l2_error",
  "stress_hdiv_error",
  "relative_equilibrium_residual",
  "state_matrix_symmetry_error",
  "direct_solver_iterations",
  "normalized_normal_trace_jump",
  "total_dofs",
  "wall_time_seconds",
  "peak_python_bytes",
]
execution_status = "ready"
executor = "manufactured"

[cases.parameters]
lame_lambda = 1.0
shear_modulus = 0.5
plane_type = "plane_strain"
integration_order_offset = 2
use_relaxation = true
solver = "scipy"

[cases.expected_orders]
high_order_gate_orders = [3, 4]
last_fine_grid_count = 3
displacement_l2_error_order_offset = 0
stress_l2_error_order_offset = 1
div_stress_l2_error_order_offset = 0
stress_hdiv_error_order_offset = 0
low_order_policy = "characterization"

[[cases]]
id = "boundary-ablation"
role = "analysis-ablation"
problem = "mixed-boundary-corner-treatment-2d"
methods = ["huzhang"]
mesh_families = ["uniform-tri", "irregular-star-refined"]
orders = [1, 2]
levels = [1, 2, 3]
metrics = [
  "boundary_residual",
  "relative_equilibrium_residual",
  "normalized_normal_trace_jump",
  "solver_status",
]
execution_status = "configured"
blockers = ["native-boundary-diagnostic-adapter"]

[cases.parameters]
stabilization = [false, true]
corner_relaxation = [false, true]
solver = "scipy"

[[cases]]
id = "sensitivity-checks"
role = "derivative-verification"
problem = "fixed-design-nonhomogeneous-traction-2d"
methods = ["huzhang-compliance", "huzhang-apparent-stress"]
mesh_families = ["uniform-tri"]
orders = [2]
levels = [1]
metrics = ["step_size", "finite_difference_relative_error", "observed_fd_order"]
execution_status = "configured"
blockers = ["native-compliance-directional-derivative-adapter", "native-stress-directional-derivative-adapter"]

[cases.parameters]
central_difference_steps = [1.0e-2, 3.0e-3, 1.0e-3, 3.0e-4, 1.0e-4, 3.0e-5, 1.0e-5]
freeze_alm_multipliers = true
freeze_alm_penalty = true
freeze_active_set = true

[[cases]]
id = "compliance-fixed-fixed"
role = "optimization-baseline"
problem = "fixed-fixed-beam-compliance-2d"
methods = ["lfem", "huzhang"]
mesh_families = ["uniform-tri"]
orders = [2, 3]
levels = [1, 2]
metrics = [
  "compliance",
  "volume_fraction",
  "relative_equilibrium_residual",
  "total_dofs",
  "wall_time_seconds",
  "peak_python_bytes",
  "optimization_iterations",
  "solver_status",
]
execution_status = "configured"
blockers = ["native-compliance-optimization-adapter", "matched-dof-pairing"]

[cases.parameters]
volume_fraction = 0.4
filter_radius = 2.4
load_width = 1.0

[[cases]]
id = "near-incompressible-bearing"
role = "optimization-application"
problem = "bearing-device-near-incompressible-compliance-2d"
methods = ["lfem", "huzhang"]
mesh_families = ["uniform-tri"]
orders = [2, 3]
levels = [1, 2]
metrics = [
  "compliance",
  "volume_fraction",
  "relative_equilibrium_residual",
  "total_dofs",
  "wall_time_seconds",
  "peak_python_bytes",
  "optimization_iterations",
  "solver_status",
]
execution_status = "configured"
blockers = ["native-near-incompressible-optimization-adapter", "frozen-design-export"]

[cases.parameters]
poisson_ratios = [0.3, 0.49, 0.499, 0.4999]
volume_fraction = 0.35
void_poisson_ratio = 0.3
poisson_penalty = 1.0
huzhang_endpoint_order = 3

[[cases]]
id = "stress-constrained-cantilever"
role = "optimization-application"
problem = "finite-width-loaded-cantilever-stress-constraint-2d"
methods = ["lfem", "huzhang"]
mesh_families = ["uniform-tri"]
orders = [2, 3]
levels = [1, 2]
metrics = [
  "volume_fraction",
  "maximum_normalized_stress",
  "stress_constraint_violation",
  "relative_equilibrium_residual",
  "total_dofs",
  "wall_time_seconds",
  "peak_python_bytes",
  "optimization_iterations",
  "solver_status",
]
execution_status = "configured"
blockers = ["native-stress-optimization-adapter", "frozen-design-export"]

[cases.parameters]
load_width = 6.0
stress_limit = 180.0
apparent_stress_epsilon = 1.0e-4
huzhang_fine_order = 3
stress_tolerance = 3.0e-3

[[cases]]
id = "frozen-design-verification"
role = "independent-verification"
problem = "common-final-designs-high-order-review"
methods = ["huzhang"]
mesh_families = ["refined-uniform-tri"]
orders = [3, 4]
levels = [1, 2]
metrics = [
  "compliance",
  "volume_fraction",
  "maximum_normalized_stress",
  "relative_equilibrium_residual",
  "successive_refinement_relative_change",
]
execution_status = "configured"
blockers = ["frozen-design-import", "native-review-adapter"]

[cases.parameters]
required_consecutive_refinements = 2
relative_change_tolerance = 1.0e-2
