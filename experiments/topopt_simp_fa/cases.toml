# ---------------------------------------------------------------------
# 工况 5/5: 2D 简支桥, 左下角固定铰支 (u_x = u_y = 0), 右下角滑动铰支
# (u_y = 0), 顶边整边均布 traction。顶部 H/10 = 4 mm 的桥面条带是实体
# 非设计域 (被动区, 密度锁定为 1), 厚度由 pipeline 按 domain 推导, 不进
# 注册表。对应博士论文算例 3.2 (桥面厚 L/30, E = 350, t = -1, quad 120x40,
# rmin = 1.5); 论文参考值: 单元密度 + 灵敏度过滤 + OC 下 c = 435.9132,
# 78 步 (迭代数因收敛准则与线性求解器差异允许不同)。单元核 (quad) 与载荷
# 路径 (distributed) 与 bearing 重合, 单独注册是为覆盖两点铰支 Dirichlet
# 模式与被动区机制 (OCOptimizer 经 Filter.design_mesh 向问题类索取掩码)。
# ---------------------------------------------------------------------
[[cases]]
# -- 台账与对照 (不进求解) --
id = "simply_supported_bridge_2d_distributed"
summary = "2D 简支桥顶边均布面力 + 桥面被动区"
role = "coverage-quad-passive-distributed"

# -- A 问题 (连续问题本身; 改了就是换一道题) --
problem = "simply_supported_bridge"
domain = [120.0, 40.0]
load = -1.0
emax = 350.0
nu = 0.3
volfrac = 0.5

# -- B 离散 (有限维近似; grid 同时决定设计空间分辨率) --
dimension = 2
cell_type = "quad"
grid = [120, 40]
space_degree = 1
integration_order = 2

# -- C 拓扑优化建模 (0/1 松弛手段; 改了必然改变最优解) --
interpolation_method = "msimp"
simp_penalty = 3.0
void_youngs_modulus = 1.0e-9
filter_type = "sensitivity"
filter_radius = 1.5
# projection_* 仅在 filter_type = "projection" 时生效, 仍逐工况显式声明。
projection_beta = 1.0
projection_eta = 0.5
projection_beta_max = 512.0
projection_continuation_iter = 50

# -- D 算法 (求同一问题的不同路径; 收敛意义下应给出同一解) --
optimizer = "oc"
move = 0.2
density_min = 1.0e-9
max_iter = 500
tol_change = 1.0e-2
assembly_method = "standard"
solve_method = "cg"
cg_rtol = 1.0e-12
cg_atol = 1.0e-12
cg_maxiter = 20000


# ---------------------------------------------------------------------
# 工况 6: 2D 悬臂梁, 左端固支, 右下角单位集中载荷 (Quad 80x50, 子结构 ft/lc 对照基准)
