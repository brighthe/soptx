domain = [60.0, 20.0]
load = -1.0
emax = 1.0
nu = 0.3
volfrac = 0.5

# -- B 离散 (有限维近似; grid 同时决定设计空间分辨率) --
dimension = 2
cell_type = "quad"
grid = [60, 20]
space_degree = 1
integration_order = 2

# -- C 拓扑优化建模 (0/1 松弛手段; 改了必然改变最优解) --
interpolation_method = "msimp"
simp_penalty = 3.0
void_youngs_modulus = 1.0e-6
filter_type = "sensitivity"
filter_radius = 2.4
# projection_* 仅在 filter_type = "projection" 时生效, 仍逐工况显式声明。
projection_beta = 1.0
projection_eta = 0.5
projection_beta_max = 512.0
projection_continuation_iter = 50

# -- D 算法 (求同一问题的不同路径; 收敛意义下应给出同一解) --
optimizer = "oc"
move = 0.2
density_min = 0.0
max_iter = 200
tol_change = 1.0e-2
assembly_method = "standard"
solve_method = "cg"
cg_rtol = 1.0e-12
cg_atol = 1.0e-12
cg_maxiter = 20000

# ---------------------------------------------------------------------
