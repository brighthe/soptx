output_mode = "dir"
device = "cpu"
min_l2_order = 1.5

# UA 走 PA 的同一条数据流, 只是不把几何量常驻: J^{-1} 与 w_q detJ_q 在每次作用里现算。
# ua 每次作用现调一次 PartialAssembly.build, 走的是 pa 那一份代码本身而不是它的副本,
# 浮点运算次序字面上一致, 因此
# 作用结果逐位相同 (小规模探针实测最大绝对差严格为 0), 误差链与 niter 列也应逐位复现
# convergence_pa。这条链因而不产出新的数值结论, 它兑现的是"层级矩阵不留空格"与耗时列。
#
# 只注册 quad / tri / hex 三格, 不收 tet。UA 每次作用要重算 NC * NQ 个 GD x GD 的逆,
# 小规模探针上 ua/pa 的单次 matvec 比在 3 ~ 6 倍之间, 而 convergence_pa[tet] 本身已是
# 225 s, 折算过去是 11 ~ 23 min —— 整条链里唯一一格就要盖过其余全部工况之和。既然
# 那一格的数值内容可由逐位相等推知, 这笔墙钟时间买不到信息, 故暂缺, 待 PA 做完张量积
# 单元的和分解 (sum factorization) 再补。tet 那一格的空缺不影响定阶: quad / tri / hex
# 已覆盖张量积与单纯形两族, 2D 与 3D 两个维数。
[cases.mesh.quad]
summary = "2D quad Q1 sinusoidal 制造解五档误差链, UA 算子 + CG, L2 阶须 >= 1.5 (理论 2.0)"
args = [
    "--dim", "2", "--mesh-type", "quad", "--model", "sinusoidal",
    "--degree", "1", "--base", "4", "--levels", "5",
    "--operator-level", "ua", "--solver", "cg", "--assembly-method", "fast",
    "--preconditioner", "none",
]
artifact = "manufactured_convergence_2d_quad_sinusoidal_p1_cg_fast_ua.json"
mesh_type = "QuadrangleMesh"
grid = "4->64"
problem = "SinusoidalPlaneStrainElasticity2D"
n = 64

# 与上面 quad 那格只差 --mesh-type。单纯形上每次作用现算的 J^{-1} 逐单元不同, 而均匀
# quad / hex 上各单元全同 —— 对 UA 这点无关紧要 (它反正每次都重算), 但对读数有意义:
# 这两格是唯一能看出"重算几何量"确实在做实事的地方。
[cases.mesh.tri]
summary = "2D tri P1 sinusoidal 制造解五档误差链, UA 算子 + CG, L2 阶须 >= 1.5 (理论 2.0)"
