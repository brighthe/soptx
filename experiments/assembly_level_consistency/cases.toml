# --------------------------------------------------------------------------
# 待扩充的数据点 (接口尚未具备, 先在此记账)
# --------------------------------------------------------------------------
#
# 1. 分类法里尚未落地的层级 (FA/TA -> LA -> EA/EbE -> PA/QA -> UA/NONE 共五级,
#    斜杠两侧是同一级的别名: PA 与 QA 是一级, 不是两级)
#
#    LA (每 rank 的局部稀疏矩阵, 求和切在 P 这一层)
#      不是本目录能取证的层级: 单 rank 时局部矩阵即全局矩阵, 与 FA 在精确算术下等价,
#      而本目录整套是单线程 CPU。要成为独立数据点得等 MPI 上来, 届时归属并行那边的
#      实验目录, 不是这里。按原文 LA "通常不算 Matrix-Free", 省的是全局编号而非矩阵。
#
#    UA / NONE (连 D_e 也不存, 每次 apply 从几何与材料即时构造, 零常驻)
#      已落地 (src/soptx/fem/levels/unassembled.py), convergence_ua 已注册 quad / tri / hex
#      三格。尚缺 tet 那一格, 理由见该工况段首注释: 折算耗时 11 ~ 23 min, 而其数值内容
#      可由 UA 对 PA 的逐位相等推知, 买不到信息。补这一格的前置条件是 PA 侧做完张量积
#      单元的和分解 (见下面第 2 条), 把基数压下来。
#
# 2. p >= 2 的 PA 链 (存储与速度的取证)
#    convergence 面板的 (层级 x 网格) 矩阵已满: fa / ea / pa 各四格 (quad / tri / hex / tet),
#    共 12 个数据点, 三个层级逐档可并排读。但三条链都是 p = 1, 而 PA 相对 EA 的存储
#    交叉点在 p = 2 (quad 与 hex 皆然, 见 src/soptx/fem/levels/partial.py 头部), p = 1
#    下 PA 反而更费。所以现有 pa 链只证"PA 算得对", 证不了"PA 更划算"。
#    取证要另开 --degree 2 的一条, 四格模板照抄 convergence_pa 只改 --degree, 并在产物
#    里读 PA / EA 的常驻字节数与单次作用耗时。注意本实现按稠密 einsum 写, 没做张量积
#    单元的和分解 (sum factorization), 因此即便到 p = 2 也只兑现存储优势, 速度仍会输给
#    EA —— 那是实现选择, 不是层级本身的结论, 记账时要写清楚, 别把它读成 PA 的上限。
#
# 3. 非均匀网格下的 PA
#    三条链的 quad / hex 两格都用 from_box 的均匀网格, 其 Jacobian 不但逐单元为常数,
#    各单元还全同, 对"PA 逐积分点存 J^{-1}"这一前提是退化算例 —— 跑绿了并不说明变
#    Jacobian 的路径是对的。tri / tet 两格稍好 (J 各单元不同, 但单元内仍是常数), 仍不
#    足以压住。需给 convergence_pa 加一格 [cases.mesh.hex-distorted] —— 前提是上游脚本
#    的 --mesh-type 支持扭曲六面体网格。
