    "--assembly-method", "fast", "--n", "8",
    "--warmup", "1", "--repeats", "3", "--gap-gate", "1e-9",
]
output_mode = "file"
artifact = "device_speedup_3d_tet_polynomial_p1_ea_fast_n8.json"

