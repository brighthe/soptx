# 图 2「Matrix-Free 算子 / Krylov 求解」的数据点注册表。
#
# 本文件只描述"跑哪一条命令、产物落在哪"; 从产物里取哪些字段、门禁怎么判,
# 写在 collect.py 里 —— TOML 描述运行, Python 描述读取, 两者不混。
#
# 约定:
#   script       仓库根起算的相对路径, 由 run.py 以子进程调用。
#   args         传给该脚本的固定参数, 逐项写全, 不依赖脚本缺省值。
#   output_mode  dir   = 用 --output-dir 重定向到本目录 outputs/, 文件名由脚本决定
#                file  = 用 --output 指定完整路径
#                fixed = 脚本落盘位置写死, 无法重定向, 只能就地读
#   artifact     产物路径; output_mode = fixed 时为仓库根起算的相对路径,
#                否则为本目录 outputs/ 下的文件名。

[figure]
id = "fig2"
title = "Matrix-Free 算子 / Krylov 求解"
question = "对不对 / 能算多大 / 切得开吗 / 搬得动吗"
consumer = "dut-postdoc:research/funding/active/china-postdoc-foundation-general-grant/assets/make_figs.py"

# --------------------------------------------------------------------------
# (a) 对不对 —— 显式组装的收敛阶 + matrix-free 与它同解
# --------------------------------------------------------------------------

[[cases]]
id = "a-fa-2d"
panel = "a"
role = "fa-chain-2d"
summary = "2D tri sinusoidal p1 五档误差链, MUMPS 稀疏直接解"
script = "examples/lagrange_elasticity/manufactured_convergence_demo.py"
# 与 3D 链统一走 MUMPS: 两条链除维数相关项外逐项对应, 表 a-1 的配置表才立得住。
# --mumps-sym 1 声明对称正定 —— 平面应变全 Dirichlet 的刚度阵与 3D 同样是 SPD。
# --assembly-method fast 显式写出: 上游 demo 的缺省已从 standard 改成 fast, 这里不吃
# 缺省值 —— 缺省一变产物名就跟着变 (method_tag 挂在 "standard" 这个名字上), 注册表里
# 写全才不会出现"文件还在、内容口径已换"的哑故障。2D 这点规模两条路径都跑得动,
# 取 fast 是与 a-fa-3d 及 ../assembly_level_consistency/ 的四条链统一口径。
args = [
    "--dim", "2", "--mesh-type", "tri", "--model", "sinusoidal",
    "--degree", "1", "--base", "4", "--levels", "5",
    "--solver", "mumps", "--mumps-sym", "1", "--assembly-method", "fast",
]
output_mode = "dir"
artifact = "manufactured_convergence_2d_tri_sinusoidal_p1_mumps_fast.json"

[[cases]]
id = "a-fa-3d"
panel = "a"
role = "fa-chain-3d"
summary = "3D tet divfree-poly p1 五档误差链, MUMPS + fast 装配"
script = "examples/lagrange_elasticity/manufactured_convergence_demo.py"
# --assembly-method fast 必须显式给: 缺省 standard 在 n=64 会把被求和掉的
# 积分点轴物化成九个 (NC, NQ, 4, 4) 临时张量, 单块 3.75 GiB, 本机跑不动。
# --mumps-sym 1 声明对称正定; 注意脚本目前不把它写进 solver_options,
# 产物里看不出这一档用的哪个 sym —— 见 results_analysis.md §3 待办。
args = [
    "--dim", "3", "--mesh-type", "tet", "--model", "divfree-poly",
    "--degree", "1", "--base", "4", "--levels", "5",
    "--solver", "mumps", "--mumps-sym", "1", "--assembly-method", "fast",
]
output_mode = "dir"
artifact = "manufactured_convergence_3d_tet_divfree-poly_p1_mumps_fast.json"

[[cases]]
id = "a-ea-rings"
panel = "a"
role = "ea-rings"
summary = "CPU 串行 stage-1 EA/FA 证据, 供 (a) 的空心环取 EA/FA 解相对差"
script = "examples/matrix_free_elasticity/stage1_evidence.py"
args = ["--dim", "all"]
# stage1_evidence.py 支持 --output-dir 重定向, 产物落在本目录 outputs/。
output_mode = "dir"
artifact = "stage1_evidence_validation.json"

