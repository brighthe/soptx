# (c) 到此为止, 不再往上加档。曾注册过 c-dev-n80 (159 万自由度) 想让 (c) 跟上正文
# "三维百万至亿级自由度"的口径, 但它在这张卡上跑不出来: n=64 一档的
# gpu_peak_allocated_bytes 已是 12.800 GiB / 整卡 15.920 GiB (占 80.4%), 峰值随自由度
# 近似线性, n=80 需约 24.8 GiB。实跑时 WDDM 不报 OOM 而是把显存分页到主机内存, 于是
# 卡在 100% 利用率上空转 13 分 41 秒未产出可用结果, 只能杀掉。
#
# 这不是把结论砍短: (c) 要证的是"同一算子换到 GPU 即可运行、结果逐位等价、规模越大
# 收益越大", 四档已经证完, 且 82 万这一档的加速比与带宽饱和曲线都已到位。"能算多大"
# 是 (b) 的题目, (b) 已经做到 n=80 / 159 万自由度。
#
# 真正被这一档暴露出来的事实反而更有用: n=64 的 12.800 GiB 里, 长期持有的 K_e 只有
# 1.688 GiB, 86.8% 是装配期瞬态 —— 挡住这条路线的是构造过程而不是 matrix-free 本身,
# 正是研究内容 2 的 PA 路径要消掉的部分。要把 (c) 推过百万, 先做那件事, 而不是加档。

# ---------------------------------------------------------------------------
# 数据组 (d) 进程级强扩展: 同一个 3D matrix-free 算子, 规模固定在 n=64 / 82.4 万
# 自由度, 只加进程数。它与数据组 (c) 的单卡 GPU 是两条不同的并行层级 —— (c) 切设备内
# (SIMT), (d) 切进程 (MPI) —— 两者的加速比不可互相外推, 必须各自成格。
#
# panel = "d" 是这组数据的标识, 不是它在成图里的位置。⚠️ 版式改造已于 2026-08-24
# 完成: **这组数据现在画在图面的 (c)**, 数据组 c 的 GPU 对照画在图面的 (d), 两套编号
# 正好错开。键名按采集顺序固定、改名会作废历史快照, 故不随图面改。
#
# 全部五档共用同一条命令, 只有 mpiexec -n 不同; OMP_NUM_THREADS=1 是必需的:
# 不锁死线程层, 每个 rank 底下的 OpenBLAS 还会再开线程, 测出来的就不再是进程级
# 强扩展, 而是进程 x 线程的乘积, 那条曲线无法归因。
#
# 计时口径: 现有五份产物跑的是 --warmup 0 --repeats 1 (脚本默认是 1/3)。单次采样
# 足以定曲线形状 (五档迭代数逐档相同 = 493, 残差逐档一致), 但把数字写进申请书成图
# 前应按默认口径重跑一遍。collect.py 只门禁五档口径是否一致, 不替单次采样背书。
# ---------------------------------------------------------------------------

[[cases]]
id = "d-mpi-p1"
panel = "d"
role = "mpi-strong"
level = "ea"
ranks = 1
summary = "3D tet polynomial p1, EA fast, n=64, 1 进程强扩展"
script = "examples/matrix_free_elasticity/benchmark_cpu_ea.py"
launcher = ["mpiexec", "-n", "1"]
env = { OMP_NUM_THREADS = "1" }
args = [
    "--mode", "mpi-ea-strong", "--model", "polynomial", "--mesh-type", "tet",
    "--assembly-method", "fast", "--n", "64",
    "--warmup", "0", "--repeats", "1",
]
output_mode = "file"
artifact = "mpi/mpi_strong_3d_n64_fast_p1.json"

