# --------------------------------------------------------------------------
# 数据组 (c) 能不能更快 —— 同一 EA matrix-free 算子的 CPU / 单卡 GPU 耗时对照
# ⚠️ 这里的 (c) 是数据组标识; 2026-08-24 版式改造后它画在**图面的 (d)**。
#
# 横轴与 (b) 同为自由度, 四档剖分逐一对应, 两格才能连起来读成
# "能算多大 / 算得多快"。
#
# 唯一变量是设备: 两侧都走 pytorch 后端, 只切 bm.set_default_device。
# 若 CPU 侧换用 numpy 后端, 加速比里会混进后端差异, 那就不是设备对照了。
#
# 每档一个进程, 但理由与 (b) 不同: (b) 是 ru_maxrss 无法按对象归因, 必须隔离;
# 这里是四档规模跨度大, 分开跑才能单独重跑失败的一档。CPU 与 GPU 两侧在同一进程
# 内先后跑 —— 解要留在内存里算相对差, 跨进程就得落盘再读回。
#
# 不是多卡强扩展: 一块卡足以回答"算子能搬上加速器", 多卡是另一个题目。
#
# 门禁在 collect.py: 两侧解相对差 <= 1e-9, 且 CG 迭代数逐档一致。
# --------------------------------------------------------------------------

[[cases]]
id = "c-dev-n8"
panel = "c"
role = "device-speedup"
level = "ea"
resolution = 8
summary = "3D tet polynomial p1, EA, n=8 CPU/GPU 求解耗时对照"
