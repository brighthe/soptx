[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "soptx"
version = "1.1.0.dev0"
description = "Finite-element analysis and structural topology optimization research platform"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-only"
authors = [
  { name = "Liang He" },
]
keywords = [
  "finite-element-method",
  "linear-elasticity",
  "topology-optimization",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "fealpy>=4,<5",
  "numpy",
  "scipy",
  "sympy",
]

[project.optional-dependencies]
viz = [
  "matplotlib",
  "pillow",
]
mpi = [
  "mpi4py>=4,<5",
]
pinn = [
  "torch",
]
test = [
  "build",
  "pytest>=8",
]

[project.urls]
Repository = "https://github.com/brighthe/soptx"
Documentation = "https://github.com/brighthe/soptx/tree/main/docs"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["soptx*"]
exclude = [
  "soptx.demo*",
  "soptx.old*",
  "soptx.tests*",
]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-config", "--strict-markers"]

[tool.coverage.run]
source = ["soptx"]
branch = true
